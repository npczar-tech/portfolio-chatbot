<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 24px;
      gap: 16px;
    }

    #toolbar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px;
    }

    #download-btn {
      background: #c4522a;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }

    #download-btn:hover { background: #d95e32; }

    #pdf-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }

    #loading {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <a id="download-btn" href="/resume.pdf" download="Nicholas_Pelczar_Resume.pdf">Download</a>
  </div>
  <div id="pdf-container">
    <div id="loading">Loading resume...</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const container = document.getElementById('pdf-container');
    const loading = document.getElementById('loading');

    pdfjsLib.getDocument('/resume.pdf').promise.then(pdf => {
      loading.remove();

      const renderPage = async (pageNum) => {
        const page = await pdf.getPage(pageNum);
        const containerWidth = container.clientWidth;
        const unscaled = page.getViewport({ scale: 1 });
        const scale = (containerWidth / unscaled.width) * (window.devicePixelRatio || 1);
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = containerWidth + 'px';
        canvas.style.height = (containerWidth * unscaled.height / unscaled.width) + 'px';

        container.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        if (pageNum < pdf.numPages) renderPage(pageNum + 1);
      };

      renderPage(1);
    }).catch(() => {
      loading.textContent = 'Failed to load resume.';
    });
  </script>
</body>
</html>
