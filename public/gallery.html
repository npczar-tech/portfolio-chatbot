<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Faunces:opsz,wght@6..72,300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px 40px;
    }

    .gallery-wrap {
      width: 100%;
      max-width: 880px;
      position: relative;
    }

    /* ── Card ── */
    .slides {
      position: relative;
      width: 100%;
      aspect-ratio: 5 / 3;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.04),
        0 8px 32px rgba(0, 0, 0, 0.07),
        0 24px 64px rgba(0, 0, 0, 0.06);
    }

    /* ── Slides ── */
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: all;
    }

    .slide-link {
      display: flex;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    /* ── Image panel ── */
    .slide-image {
      flex: 0 0 60%;
      overflow: hidden;
      position: relative;
    }

    .slide-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .slide-link:hover .slide-image img {
      transform: scale(1.04);
    }

    /* ── Text panel ── */
    .slide-content {
      flex: 0 0 40%;
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      border-left: 1px solid rgba(0, 0, 0, 0.06);
    }

    .slide-meta {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(13, 35, 51, 0.38);
    }

    .slide-title {
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      color: #0d2333;
      margin-top: 2px;
    }

    .slide-desc {
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: 0.02em;
      color: rgba(13, 35, 51, 0.6);
    }

    .slide-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .slide-tag {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(13, 35, 51, 0.06);
      color: rgba(13, 35, 51, 0.45);
    }

    .slide.reversed .slide-link {
      flex-direction: row-reverse;
    }

    .slide.reversed .slide-content {
      border-left: none;
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .slide-cta {
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #c4522a;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: gap 0.2s ease;
    }

    .slide-link:hover .slide-cta {
      gap: 9px;
    }

    /* ── Arrows ── */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      color: #0d2333;
      transition: background 0.2s, box-shadow 0.2s;
      z-index: 10;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.13);
    }

    .nav-prev { left: -18px; }
    .nav-next { right: -18px; }

    /* ── Dots ── */
    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(13, 35, 51, 0.18);
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      background: #c4522a;
      transform: scale(1.35);
    }
  </style>
</head>
<body>
  <div class="gallery-wrap">
    <div class="slides" id="slides"></div>
    <button class="nav-btn nav-prev" id="prev" aria-label="Previous">&#8249;</button>
    <button class="nav-btn nav-next" id="next" aria-label="Next">&#8250;</button>
    <div class="dots" id="dots"></div>
  </div>

  <script>
    const PROJECTS = [
      {
        image: 'autocapture.jpg',
        meta: '2026 · Meta · Oakley Smart Glasses',
        title: 'Autocapture',
        description: 'An AI capture feature powered by Garmin integration, that automatically generates a compilation of a user\'s workout based on key stats and milestones.',
        tags: ['AI', 'Voice', 'Wearables'],
        url: 'https://www.nicholaspelczar.com/work/autocapture'
      },
      {
        image: 'liveai.jpg',
        meta: '2025 · Meta · Ray-Ban Smart Glasses',
        title: 'Live AI',
        description: 'A real-time multimodal AI session letting users ask ongoing questions about their environment and what they\'re seeing.',
        tags: ['AI', 'Multimodal', 'Voice'],
        url: 'https://www.nicholaspelczar.com/work/live-ai'
      },
      {
        image: 'quickbooks.jpg',
        meta: '2020 · Intuit · QuickBooks',
        title: 'QB Assistant',
        description: 'An in-product self-help chatbot, helping small business owners navigate complex questions about their finances and accounting software.',
        tags: ['Chatbot', 'NLU', 'Customer Success'],
        url: 'https://www.nicholaspelczar.com/work/qb-assistant'
      },
      {
        image: 'barbie.jpg',
        meta: '2015 · Mattel · PullString',
        title: 'Hello Barbie',
        description: 'The first interactive, voice-enabled Barbie doll, featuring 10k lines of recorded dialogue across a variety of kid-friendly games and conversational subjects.',
        tags: ['Voice', 'Persona', 'Toy'],
        url: 'https://www.nicholaspelczar.com/work/hello-barbie'
      },
      {
        image: 'humani.jpg',
        meta: '2016 · PullString · Messenger',
        title: 'Humani',
        description: 'A 20-hour branching narrative chatbot featured at Facebook\'s F8 conference, guiding users to make pivotal decisions during Jessie Humani\'s topsy-turvy quarter-life crisis.',
        tags: ['Chatbot', 'Narrative', 'F8'],
        url: 'https://www.nicholaspelczar.com/work/humani'
      },
      {
        image: 'spikes.jpg',
        meta: '2017 · IAAF · Skype',
        title: 'SPIKES',
        description: 'A chatbot companion for the 2017 IAAF World Championships delivering daily updates, athlete features, and customizable content through real-time API integration.',
        tags: ['Chatbot', 'Sports', 'API'],
        url: 'https://www.nicholaspelczar.com/work/spikes'
      }
    ];

    const slidesEl = document.getElementById('slides');
    const dotsEl   = document.getElementById('dots');
    let current = 0;

    PROJECTS.forEach((p, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (i === 0 ? ' active' : '') + (i % 2 === 1 ? ' reversed' : '');
      slide.innerHTML = `
        <a class="slide-link" href="${p.url}">
          <div class="slide-image">
            <img src="${p.image}" alt="${p.title}">
          </div>
          <div class="slide-content">
            <div class="slide-meta">${p.meta}</div>
            <h2 class="slide-title">${p.title}</h2>
            <p class="slide-desc">${p.description}</p>
            <div class="slide-tags">${p.tags.map(t => `<span class="slide-tag">${t}</span>`).join('')}</div>
            <div class="slide-cta">View case study →</div>
          </div>
        </a>`;
      slidesEl.appendChild(slide);

      const dot = document.createElement('span');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });

    const slides = document.querySelectorAll('.slide');
    const dots   = document.querySelectorAll('.dot');

    function goTo(n) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (n + PROJECTS.length) % PROJECTS.length;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    document.getElementById('prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('next').addEventListener('click', () => goTo(current + 1));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });
  </script>
</body>
</html>
